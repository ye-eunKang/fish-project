<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>주사위 흔들기 & 햅틱 인터랙션</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    /* iOS 센서 활성화 버튼 */
    #start-btn {
      position: absolute;
      z-index: 100;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background: #1e293b;
      color: #fff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 상단 안내 박스 */
    #hud {
      position: absolute;
      top: 40px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    #guide-text {
      font-size: 18px;
      font-weight: 600;
      color: #334155;
    }
    #sub-text {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* 3D 주사위 씬 */
    .scene {
      width: 120px;
      height: 120px;
      perspective: 600px;
      margin-top: 20px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-60px) rotateX(-20deg) rotateY(-25deg);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.2);
    }

    .cube.shaking {
      animation: diceRoll 0.35s infinite linear;
    }

    @keyframes diceRoll {
      0% { transform: translateZ(-60px) rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      25% { transform: translateZ(-60px) rotateX(90deg) rotateY(180deg) rotateZ(45deg); }
      50% { transform: translateZ(-60px) rotateX(180deg) rotateY(270deg) rotateZ(90deg); }
      75% { transform: translateZ(-60px) rotateX(270deg) rotateY(90deg) rotateZ(135deg); }
      100% { transform: translateZ(-60px) rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
    }

    /* 주사위 각 면 */
    .cube-face {
      position: absolute;
      width: 120px;
      height: 120px;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.06), 0 4px 10px rgba(0,0,0,0.08);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 16px;
    }

    /* 3D 주사위 면 배치 */
    .face-1 { transform: rotateY(0deg) translateZ(60px); }
    .face-6 { transform: rotateY(180deg) translateZ(60px); }
    .face-3 { transform: rotateY(90deg) translateZ(60px); }
    .face-4 { transform: rotateY(-90deg) translateZ(60px); }
    .face-5 { transform: rotateX(90deg) translateZ(60px); }
    .face-2 { transform: rotateX(-90deg) translateZ(60px); }

    /* 주사위 눈금(점) 스타일 */
    .dot {
      width: 16px;
      height: 16px;
      background-color: #0f172a;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }
    .face-1 .dot { background-color: #ef4444; width: 22px; height: 22px; } /* 1번 빨간 점 */

    /* 눈금 배치 */
    .dot-center { grid-area: 2 / 2; }
    .dot-tl { grid-area: 1 / 1; }
    .dot-tr { grid-area: 1 / 3; }
    .dot-ml { grid-area: 2 / 1; }
    .dot-mr { grid-area: 2 / 3; }
    .dot-bl { grid-area: 3 / 1; }
    .dot-br { grid-area: 3 / 3; }

    /* 하단 결과 뱃지 */
    #result-badge {
      margin-top: 50px;
      padding: 8px 20px;
      background: #e2e8f0;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      transition: all 0.3s ease;
    }

    /* iOS 햅틱 유도용 히든 토글 */
    #ios-haptic-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- iOS Taptic Engine 유도용 숨김 요소 -->
  <input type="checkbox" id="ios-haptic-toggle">

  <button id="start-btn">주사위 굴리기 시작 (센서 활성화)</button>

  <div id="hud">
    <div id="guide-text">폰을 흔들어 주사위를 굴리세요!</div>
    <div id="sub-text">(화면을 터치해도 굴러갑니다)</div>
  </div>

  <div class="scene">
    <div id="cube" class="cube">
      <!-- 1번 면 -->
      <div class="cube-face face-1">
        <div class="dot dot-center"></div>
      </div>
      <!-- 2번 면 -->
      <div class="cube-face face-2">
        <div class="dot dot-tl"></div>
        <div class="dot dot-br"></div>
      </div>
      <!-- 3번 면 -->
      <div class="cube-face face-3">
        <div class="dot dot-tl"></div>
        <div class="dot dot-center"></div>
        <div class="dot dot-br"></div>
      </div>
      <!-- 4번 면 -->
      <div class="cube-face face-4">
        <div class="dot dot-tl"></div>
        <div class="dot dot-tr"></div>
        <div class="dot dot-bl"></div>
        <div class="dot dot-br"></div>
      </div>
      <!-- 5번 면 -->
      <div class="cube-face face-5">
        <div class="dot dot-tl"></div>
        <div class="dot dot-tr"></div>
        <div class="dot dot-center"></div>
        <div class="dot dot-bl"></div>
        <div class="dot dot-br"></div>
      </div>
      <!-- 6번 면 -->
      <div class="cube-face face-6">
        <div class="dot dot-tl"></div>
        <div class="dot dot-tr"></div>
        <div class="dot dot-ml"></div>
        <div class="dot dot-mr"></div>
        <div class="dot dot-bl"></div>
        <div class="dot dot-br"></div>
      </div>
    </div>
  </div>

  <div id="result-badge">결과: 대기 중</div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const cube = document.getElementById('cube');
    const resultBadge = document.getElementById('result-badge');
    const hapticToggle = document.getElementById('ios-haptic-toggle');

    let hasStarted = false;
    let isRolling = false;

    // 가속도 센서 임계치
    let lastX = null, lastY = null, lastZ = null;
    let lastShakeTimestamp = 0;
    const SHAKE_THRESHOLD = 18; // 흔들기 감도

    // 눈금별 정면 착지 3D 회전 각도
    const faceRotations = {
      1: { x: 0, y: 0 },
      6: { x: 0, y: 180 },
      3: { x: 0, y: -90 },
      4: { x: 0, y: 90 },
      5: { x: -90, y: 0 },
      2: { x: 90, y: 0 }
    };

    // 1. 센서 권한 허용 (iOS Safari 대응)
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const res = await DeviceMotionEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
          } else {
            alert('모션 센서 권한이 거부되었습니다.');
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }
      startBtn.style.display = 'none';
      hasStarted = true;
      triggerHaptic('tap');
    });

    // 화면 터치/클릭으로도 굴리기 테스트 가능
    window.addEventListener('pointerdown', (e) => {
      if (!hasStarted || e.target === startBtn || isRolling) return;
      rollDice();
    });

    // 2. 가속도 감지 (흔들림 포착)
    function handleMotion(e) {
      if (!hasStarted || isRolling) return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      const now = performance.now();
      if (now - lastShakeTimestamp < 400) return; // 0.4초 쿨다운

      if (lastX !== null) {
        const deltaX = Math.abs(acc.x - lastX);
        const deltaY = Math.abs(acc.y - lastY);
        const deltaZ = Math.abs(acc.z - lastZ);

        if (deltaX + deltaY + deltaZ > SHAKE_THRESHOLD) {
          lastShakeTimestamp = now;
          rollDice();
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }

    // 3. 주사위 굴리기 및 햅틱 효과 실행
    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      resultBadge.textContent = "구르는 중...";
      resultBadge.style.background = "#cbd5e1";
      resultBadge.style.color = "#334155";

      // 굴러갈 때: 덜컹거리는 연타 햅틱 진동 패턴 실행
      triggerHaptic('roll');

      // 3D 회전 애니메이션 시작
      cube.classList.add('shaking');

      // 1초 후 멈추고 눈금 확정
      setTimeout(() => {
        cube.classList.remove('shaking');

        // 1~6 중 랜덤 추출
        const outcome = Math.floor(Math.random() * 6) + 1;
        const targetRot = faceRotations[outcome];

        // 3D 착지 회전 적용 (기본 360도 배수를 더해 회전감 부여)
        cube.style.transform = `translateZ(-60px) rotateX(${targetRot.x + 360}deg) rotateY(${targetRot.y + 360}deg)`;

        // 멈추는 순간: 묵직한 착지 충격 햅틱 진동
        triggerHaptic('impact');

        resultBadge.textContent = `눈금: ${outcome}`;
        resultBadge.style.background = outcome === 1 ? "#fee2e2" : "#e0f2fe";
        resultBadge.style.color = outcome === 1 ? "#dc2626" : "#0284c7";

        setTimeout(() => {
          isRolling = false;
        }, 500);
      }, 900);
    }

    // 4. 멀티 플랫폼 햅틱 진동 처리 함수
    function triggerHaptic(type) {
      // 1) 안드로이드 표준 진동 API
      if (navigator.vibrate) {
        if (type === 'roll') {
          // 주사위가 컵 안에서 튀는 듯한 따르르륵 리듬 진동 (진동, 쉼, 진동...)
          navigator.vibrate([35, 40, 45, 40, 50, 40, 60]);
        } else if (type === 'impact') {
          // 바닥에 탁 멈춰 서는 묵직한 피니시 타격
          navigator.vibrate([120]);
        } else {
          navigator.vibrate(40);
        }
      }

      // 2) iOS Taptic Engine 호환 트리거 시도
      try {
        hapticToggle.checked = !hapticToggle.checked;
      } catch (e) {}
    }
  </script>
</body>
</html>
