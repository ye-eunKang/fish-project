<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>물건 거래 인터랙션</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 1번 사진: 초기 안내 박스 (시작 버튼 없이 바로 표시) */
    #intro-box {
      background-color: #e5e7eb;
      color: #111827;
      font-size: 17px;
      font-weight: 500;
      padding: 16px 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      animation: pulse 1.6s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* 2, 3, 4번 사진: 메인 거래 컨테이너 */
    #trade-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 650px;
      padding: 0 24px;
      position: relative;
    }

    /* 5, 6, 7번 사진: 원형 아이템 */
    #item-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      color: #000;
      margin-bottom: 25px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    /* 거래하기 버튼 (우측 상단 배치) */
    #trade-action-wrapper {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    #trade-btn {
      background-color: #bbf7d0; /* 연두색 */
      color: #15803d;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    #trade-btn:active {
      transform: scale(0.95);
    }

    /* 하단 설명문 박스 */
    #desc-box {
      width: 100%;
      background-color: #f3f4f6;
      border-radius: 12px;
      padding: 20px 24px;
      color: #1f2937;
      font-size: 15px;
      line-height: 1.65;
      word-break: keep-all;
    }

    /* 결과 모달/화면 */
    #result-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
      text-align: center;
    }
    #result-screen.active {
      display: flex;
    }
    #result-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    #result-desc {
      font-size: 16px;
      color: #4b5563;
      line-height: 1.6;
      max-width: 480px;
    }
    #retry-btn {
      margin-top: 30px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 600;
      background: #e5e7eb;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1번 화면: 처음 접속 시 바로 표시되는 안내 박스 -->
  <div id="intro-box">
    폰을 흔들어 교환할 물건을 꺼내보세요
  </div>

  <!-- 2, 3, 4번 화면: 아이템 등장 및 거래 조작 영역 -->
  <div id="trade-container">
    <div id="item-circle">랜덤 1</div>
    <div id="trade-action-wrapper">
      <button id="trade-btn">거래하기</button>
    </div>
    <div id="desc-box"></div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen">
    <div id="result-title"></div>
    <div id="result-desc"></div>
    <button id="retry-btn">다시 시도하기</button>
  </div>

  <script>
    const items = [
      {
        id: 1,
        title: "랜덤 1",
        color: "#fecaca", // 연분홍
        desc: "주머니에서 oo이 나왔다. 사람들에게 많은 인기를 끌었던 방송에 많이 등장했던 것 같다.<br>이 예능프로의 팬이라면 이 거래를 승낙할 수도 있다.",
        isSuccess: false,
        failReason: "상대방이 고개를 갸웃거리며 물건을 거절했습니다.<br>(거래 실패)"
      },
      {
        id: 2,
        title: "랜덤 2",
        color: "#fef9c3", // 연노랑
        desc: "주머니에서 영수증이 나왔다.<br>돈이나 물품을 받았다는 사실을 증명하기 위해 발행하는 증서이다.<br>영수증에 따르면 점심에 아주 맛있는 음식을 먹은 것으로 보인다.",
        isSuccess: false,
        failReason: "구겨진 영수증을 보고 상대방이 등을 돌렸습니다.<br>(거래 실패)"
      },
      {
        id: 3,
        title: "랜덤 3",
        color: "#bbf7d0", // 연두
        desc: "주머니에서 뜨개로 만든 네잎클로버가 나왔다.<br>네잎클로버는 일반적인 세잎 토끼풀의 희귀한 변이로, 잎이 세 개 대신 네 개의 작은 잎을 가지고 있다.<br>전해 내려오는 말에 따르면 이러한 토끼풀은 행운을 가져다준다고 한다.",
        isSuccess: true,
        successMessage: "네잎클로버의 온기에 이끌려 물고기가 모습을 드러냅니다.<br>(거래 성공!)"
      }
    ];

    let currentItemIndex = null;
    let isTradeLocked = false;
    let isSensorActive = false;

    // 기울기(Orientation) 감지 변수
    let lastBeta = null;
    let lastGamma = null;
    let lastChangeTime = 0;
    
    // 기울기 변화 임계치 (손목을 휙 꺾는 속도/각도 감지)
    const TILT_SPEED_THRESHOLD = 32;

    const introBox = document.getElementById('intro-box');
    const tradeContainer = document.getElementById('trade-container');
    const itemCircle = document.getElementById('item-circle');
    const descBox = document.getElementById('desc-box');
    const tradeBtn = document.getElementById('trade-btn');
    const resultScreen = document.getElementById('result-screen');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const retryBtn = document.getElementById('retry-btn');

    // 1. 센서 자동 등록 함수
    async function initOrientation() {
      if (isSensorActive) return;

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            isSensorActive = true;
          }
        } catch (e) {
          console.warn("Permission rejected or waiting for user gesture:", e);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        isSensorActive = true;
      }
    }

    // 페이지 로드 시 즉시 센서 등록 시도
    window.addEventListener('DOMContentLoaded', initOrientation);

    // iOS 등 첫 사용자 제스처가 필요한 환경 대비 (화면 터치 시 즉시 권한 승인 및 백업 트리거)
    window.addEventListener('pointerdown', (e) => {
      initOrientation();
      // 거래하기/재시도 버튼 터치가 아닐 때 터치로도 랜덤 전환 가능
      if (!isTradeLocked && e.target !== tradeBtn && e.target !== retryBtn) {
        changeRandomItem();
      }
    });

    // 2. 기울기(DeviceOrientation) 변화 감지 로직
    function handleOrientation(e) {
      if (isTradeLocked) return;

      const beta = e.beta || 0;   // 앞뒤 기울기 (-180 ~ 180)
      const gamma = e.gamma || 0; // 좌우 기울기 (-90 ~ 90)
      const now = performance.now();

      if (now - lastChangeTime < 600) return; // 연속 변경 방지 (0.6초 쿨타임)

      if (lastBeta !== null && lastGamma !== null) {
        const deltaBeta = Math.abs(beta - lastBeta);
        const deltaGamma = Math.abs(gamma - lastGamma);
        const totalDelta = deltaBeta + deltaGamma;

        // 폰을 특정 방향으로 휙 젖혔을 때 아이템 교체
        if (totalDelta > TILT_SPEED_THRESHOLD) {
          lastChangeTime = now;
          changeRandomItem();
        }
      }

      lastBeta = beta;
      lastGamma = gamma;
    }

    // 3. 랜덤 아이템 교체 및 강한 햅틱 진동
    function changeRandomItem() {
      vibrateStrong('tilt');

      // 첫 반응 시 1번 안내문 숨기고 아이템 UI 노출
      if (introBox.style.display !== 'none') {
        introBox.style.display = 'none';
        tradeContainer.style.display = 'flex';
      }

      // 이전 아이템과 겹치지 않게 변경
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * items.length);
      } while (items.length > 1 && nextIndex === currentItemIndex);

      currentItemIndex = nextIndex;
      renderItem(items[currentItemIndex]);
    }

    function renderItem(item) {
      itemCircle.style.transform = 'scale(0.85)';
      setTimeout(() => {
        itemCircle.textContent = item.title;
        itemCircle.style.backgroundColor = item.color;
        itemCircle.style.transform = 'scale(1)';
      }, 90);

      descBox.innerHTML = item.desc;
    }

    // 4. '거래하기' 버튼 클릭 처리
    tradeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentItemIndex === null || isTradeLocked) return;
      isTradeLocked = true;

      const currentItem = items[currentItemIndex];

      if (currentItem.isSuccess) {
        // [랜덤 3]: 성공 진동 (빠른 리듬 3단 펄스)
        vibrateStrong('success');
        resultTitle.textContent = "거래 성사!";
        resultTitle.style.color = "#16a34a";
        resultDesc.innerHTML = currentItem.successMessage;
        retryBtn.style.display = 'none';
      } else {
        // [랜덤 1, 2]: 실패 진동 (묵직한 단일 진동)
        vibrateStrong('fail');
        resultTitle.textContent = "거래 실패...";
        resultTitle.style.color = "#dc2626";
        resultDesc.innerHTML = currentItem.failReason;
        retryBtn.style.display = 'inline-block';
      }

      resultScreen.classList.add('active');
    });

    // 실패 후 다시 시도
    retryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resultScreen.classList.remove('active');
      isTradeLocked = false;
      changeRandomItem();
    });

    // 5. 체감 강도를 높인 햅틱 진동 패턴
    function vibrateStrong(pattern) {
      if (!navigator.vibrate) return;

      if (pattern === 'tilt') {
        // 폰을 휙 기울일 때: 덜컥 걸리는 2단 타격감
        navigator.vibrate([110, 40, 160]);
      } else if (pattern === 'success') {
        // 거래 성공
        navigator.vibrate([80, 50, 80, 50, 200]);
      } else if (pattern === 'fail') {
        // 거래 실패
        navigator.vibrate([350]);
      } else {
        navigator.vibrate(80);
      }
    }
  </script>
</body>
</html>
